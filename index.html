<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f9fc">
<meta name="description" content="مخچه، دستیار مالی کسب‌وکار شما. به‌زودی در mokhche.app">
<title>مخچه | Mokhche — Coming Soon</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/vazirmatn@5.3.0/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/vazirmatn@5.3.0/800.css">
<style>
:root{color-scheme:light;background:#f7f9fc;color:#1f2c42;font-family:Vazirmatn,Tahoma,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0}
.hero{min-height:100svh;display:grid;place-items:center;padding:56px 24px;text-align:center;isolation:isolate;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 32%,#e3efff 0%,transparent 57%),#f7f9fc}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(#2674ee12 1px,transparent 1px),linear-gradient(90deg,#2674ee12 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at 50% 35%,#000,transparent 72%)}
.content{width:min(100%,620px)}
.mark{display:flex;align-items:center;justify-content:center;gap:7px;width:80px;height:80px;margin:0 auto 32px;border:1px solid #2674ee38;border-radius:25px;background:#ffffff;box-shadow:0 0 60px #2674ee26;transform:rotate(-9deg)}
.mark i{width:9px;border-radius:9px;background:#2674ee;height:24px}
.mark i:nth-child(2){height:41px}
.mark i:nth-child(3){height:31px}
h1{font-size:clamp(68px,13vw,132px);line-height:1.18;margin:0;font-weight:800}
.name{margin:8px 0 25px;font-size:clamp(14px,3vw,21px);letter-spacing:.36em;text-transform:uppercase;color:#2674ee}
.copy{font-size:clamp(15px,3vw,19px);line-height:2;margin:0;color:#526783}
.status{display:inline-flex;align-items:center;gap:9px;margin:34px 0 0;padding:10px 17px;border:1px solid #2674ee33;border-radius:99px;color:#245299;font-size:12px;letter-spacing:.06em}
.status::before{content:"";width:7px;height:7px;background:#2674ee;border-radius:50%;box-shadow:0 0 13px #2674ee55}
</style>
</head>
<body>
<main class="hero">
<div class="content">
<div class="mark" aria-hidden="true"><i></i><i></i><i></i></div>
<h1>مخچه</h1>
<p class="name" lang="en" dir="ltr">Mokhche</p>
<p class="copy">دستیار مالی کسب‌وکار شما</p>
<p class="status" lang="en" dir="ltr">Coming Soon…</p>
</div>
</main>
</body>
</html>
